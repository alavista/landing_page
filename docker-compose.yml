version: "3.9"

services:
  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy_landing_page

  caddy:
    image: caddy:latest
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/caddy:ro
      - ./js:/usr/share/caddy:ro
      - ./css:/usr/share/caddy:ro
      - ./bootstrap:/usr/share/caddy:ro
      - ./bootstrap-icons-1.13.1:/usr/share/caddy:ro
      - ./aos:/usr/share/caddy:ro
      - ./img:/usr/share/caddy:ro
      - ./fonts:/usr/share/caddy:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static.rule=Host(`${DOMINIO}`)"
      - "traefik.http.routers.static.entrypoints=websecure"
      - "traefik.http.routers.static.tls.certresolver=myresolver"
    networks:
      - proxy_landing_page

networks:
  proxy:
    external: true